services:
  telegram-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - bot-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "10000:10000"
volumes:
  bot-data:
