services:
  - type: web
    name: telegram-screenshot-relay-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: APIFLASH_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: ENABLE_REMOTE_VISION
        value: "true"
      - key: SELF_PING_ENABLED
        value: "true"
      - key: SELF_PING_INTERVAL_SECONDS
        value: "300"
